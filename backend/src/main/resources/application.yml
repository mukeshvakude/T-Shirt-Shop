# Shared defaults. Every secret comes from environment variables, or from the
# git-ignored .env file in the repository root (imported below for local runs).
spring:
  application:
    name: tshirt-shop-backend
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: tshirt-shop-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    max-image-bytes: 5242880
    max-image-dimension: 4000
  stock:
    reservation-minutes: ${STOCK_RESERVATION_MINUTES:15}
  payments:
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
  api-docs-enabled: true
  jobs:
    enabled: true
    token-cleanup-cron: "0 30 3 * * *"
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:tshirt-shop}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}m
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}d
    refresh-cookie:
      name: tshirt_rt
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
    password-reset-ttl: 30m
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    rate-limit:
      login-per-minute: 10
      register-per-hour: 10
      forgot-password-per-hour: 5
      newsletter-per-hour: 10
      contact-per-hour: 5
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:Store Admin}
    log-password-reset-links: false

logging:
  level:
    root: INFO
    com.shop: INFO
