# Production: no sample data, no Swagger, JSON logs, strict health output.
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD, APP_FRONTEND_URL,
# APP_CORS_ALLOWED_ORIGINS (plus JWT/Razorpay/mail vars from later phases).
spring:
  flyway:
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  api-docs-enabled: false

logging:
  structured:
    format:
      console: ecs
  level:
    com.shop: INFO
