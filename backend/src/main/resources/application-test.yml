# Integration tests (mvnw verify) against the MySQL test database.
# TEST_DB_* fall back to the dev credentials with the tshirt_shop_test schema.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/tshirt_shop_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:${DB_USERNAME}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}
  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.shop: INFO

app:
  security:
    jwt:
      # Test-only key (public, never valid outside tests).
      secret: dGVzdC1vbmx5LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTAxMjM0NTY3ODlhYmNkZWY=
    refresh-cookie:
      secure: false
    rate-limit:
      login-per-minute: 1000
      register-per-hour: 1000
      forgot-password-per-hour: 1000
    admin:
      email: admin@test.local
      password: TestAdmin123
      full-name: Test Admin
  jobs:
    enabled: false
  storage:
    local-dir: ./target/test-uploads
