# Local development: sample catalog, readable logs, Swagger UI on.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.shop: DEBUG
    org.hibernate.SQL: INFO

app:
  security:
    # Email delivery arrives in Phase 17. Until then the reset link is logged in dev.
    log-password-reset-links: true
