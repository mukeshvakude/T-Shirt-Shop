# Nginx site for the T-Shirt Shop. Replace shop.example.in with your domain, then:
#   sudo cp deploy/nginx-tshirt-shop.conf /etc/nginx/sites-available/tshirt-shop
#   sudo ln -s /etc/nginx/sites-available/tshirt-shop /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d shop.example.in -d www.shop.example.in
#   sudo nginx -t && sudo systemctl reload nginx
# (DEPLOYMENT.md explains how to get the first certificate before the HTTPS blocks exist.)
#
# Angular is served as static files; /api and /media go to Spring Boot on 127.0.0.1:8080
# (same origin, so no CORS and the refresh cookie stays first-party).

limit_req_zone $binary_remote_addr zone=shop_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.in www.shop.example.in;
    # Certificate renewals are answered here; everything else goes to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://shop.example.in$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shop.example.in;
    ssl_certificate     /etc/letsencrypt/live/shop.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.in/privkey.pem;
    return 301 https://shop.example.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example.in;

    ssl_certificate     /etc/letsencrypt/live/shop.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/tshirt-shop/browser;   # contents of frontend/dist/tshirt-shop/browser
    index index.html;

    # Uploads: designer artwork is up to 5 MB per image
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Nginx drops server-level add_header lines in any location that has its own add_header,
    # so the security headers live in a snippet included where needed.
    include /etc/nginx/snippets/tshirt-shop-headers.conf;

    # API: overwrite (do not append) the forwarding headers so clients cannot fake their IP for rate limits
    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }

    # Product images and design files (the backend sets cache and privacy headers)
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health for uptime monitors; other actuator endpoints are not published
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
    location /actuator/ { return 404; }

    # Hashed Angular bundles never change: cache for a year
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        include /etc/nginx/snippets/tshirt-shop-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Angular routes (/shop, /product/..., /admin/...) all load index.html, which must not be cached
    location / {
        include /etc/nginx/snippets/tshirt-shop-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
