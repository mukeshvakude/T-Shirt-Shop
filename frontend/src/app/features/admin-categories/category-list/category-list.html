<div class="page">
  <header class="page-header">
    <div>
      <h1>Categories</h1>
      <p>Group products for shop navigation and filters.</p>
    </div>
    <button mat-flat-button (click)="edit(null)">
      <span class="material-symbols-outlined">add</span> New category
    </button>
  </header>

  <section class="card table-card">
    @if (loading()) { <mat-progress-bar mode="indeterminate" /> }
    <table mat-table [dataSource]="categories()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let c">
          <span class="name">{{ c.name }}</span>
          @if (c.system) { <span class="badge">Built-in</span> }
        </td>
      </ng-container>
      <ng-container matColumnDef="slug">
        <th mat-header-cell *matHeaderCellDef>URL name</th>
        <td mat-cell *matCellDef="let c" class="muted">/{{ c.slug }}</td>
      </ng-container>
      <ng-container matColumnDef="products">
        <th mat-header-cell *matHeaderCellDef>Products</th>
        <td mat-cell *matCellDef="let c">{{ c.productCount }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Shop</th>
        <td mat-cell *matCellDef="let c" [class.off]="!c.active">{{ c.active ? 'Visible' : 'Hidden' }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c" class="actions">
          <button mat-button (click)="edit(c)">Edit</button>
          @if (!c.system) {
            <button mat-icon-button (click)="remove(c)" [disabled]="c.productCount > 0"
                    [attr.aria-label]="'Delete ' + c.name"
                    [title]="c.productCount > 0 ? 'Move or delete its products first' : 'Delete'">
              <span class="material-symbols-outlined">delete</span>
            </button>
          }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </section>
</div>
